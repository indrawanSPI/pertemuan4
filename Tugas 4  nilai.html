<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Registrasi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .form-container {
      background: white;
      padding: 25px 35px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Form Registrasi</h2>

    <label>Nama Depan:</label>
    <input type="text" id="namaDepan" placeholder="Masukkan nama depan" />

    <label>Nama Belakang:</label>
    <input type="text" id="namaBelakang" placeholder="Masukkan nama belakang" />

    <label>Nilai Angka:</label>
    <input type="number" id="nilaiAngka" placeholder="Masukkan nilai (0-100)" />

    <button onclick="tampilkanData()">Kirim</button>
  </div>

  <script>
    function konversiNilai(nilai) {
      if (nilai >= 90) return "A";
      else if (nilai >= 80) return "B";
      else if (nilai >= 70) return "C";
      else if (nilai >= 60) return "D";
      else return "E";
    }

    function tampilkanData() {
      const depan = document.getElementById("namaDepan").value;
      const belakang = document.getElementById("namaBelakang").value;
      const nilaiAngka = parseFloat(document.getElementById("nilaiAngka").value);
      const nilaiHuruf = konversiNilai(nilaiAngka);

      console.log(`Nama Lengkap : ${depan} ${belakang}`);
      console.log(`Nilai Angka  : ${nilaiAngka}`);
      console.log(`Nilai Huruf  : ${nilaiHuruf}`);

      alert(
        `Nama Lengkap : ${depan} ${belakang}\nNilai Angka : ${nilaiAngka}\nNilai Huruf : ${nilaiHuruf}`
      );
    }
  </script>
</body>
</html>
